name: Multi-Event Workflow

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
        types:
            - opened
            - closed
            
    workflow_dispatch:

jobs:
    on-push:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
          - name: Running on main push
            if: github.ref == 'refs/heads/main'
            run: echo "Running on main push"

          - name: Running on develop push
            if: github.ref == 'refs/heads/develop'
            run: echo "Running on develop push"

    on-pull-request-opened:
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        runs-on: ubuntu-latest
        steps:
          - name: Running on pull request to main
            if: github.event.pull_request.base.ref == 'main'        
            run: echo "Running on pull request to main"

          - name: Running on pull request to develop
            if: github.event.pull_request.base.ref == 'develop'
            run: echo "Running on pull request to develop"

    on-pull-request-closed:
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        steps:
          - name: Running on pull request closed
            run: echo "Running on pull request closed"

    on-pull-request-merged:
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        steps:
          - name: Running on pull request merged
            run: echo "Running on pull request merged"

    on-workflow-dispatch:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
          - name: Running on workflow dispatch
            run: echo "Running on workflow dispatch"